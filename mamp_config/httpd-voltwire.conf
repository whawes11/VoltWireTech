# ==============================================================================
# MAMP / Apache VirtualHost Configuration for VoltWire Field Service
# Place or include this file in:
# /Applications/MAMP/conf/apache/extra/httpd-vhosts.conf
# or in MAMP PRO > Hosts > Advanced > Additional Parameters
# ==============================================================================

<VirtualHost *:80>
    ServerName voltwiretech.com
    ServerAlias www.voltwiretech.com voltwire.local

    # Reverse proxy to VoltWire Python Escrow & Dispatch Engine on port 8080
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Standard logging
    ErrorLog "/Applications/MAMP/logs/voltwire_error.log"
    CustomLog "/Applications/MAMP/logs/voltwire_access.log" combined

    <Proxy *>
        Order deny,allow
        Allow from all
    </Proxy>
</VirtualHost>
